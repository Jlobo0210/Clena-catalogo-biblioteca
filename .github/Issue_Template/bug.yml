name: Bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: local / desplegado, navegador, celular
