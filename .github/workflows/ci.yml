# CI del proyecto: corre en cada Pull Request hacia dev o main y en cada push a esas ramas.
# Para la protección de ramas, marcar como requerido el check «CI / Resultado».
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Si llegan commits nuevos al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (lint, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias (genera el cliente de Prisma)
        run: npm ci

      - name: Lint (incluye la regla de dependencia entre capas)
        run: npm run lint -- --max-warnings=0

      - name: Pruebas unitarias con cobertura (mínimo 70 % en dominio y aplicación)
        run: npm run test:cov -- --ci

      - name: Pruebas e2e
        run: npm run test:e2e -- --ci

      - name: Build
        run: npm run build

      - name: Reporte de cobertura en el resumen del job
        if: always() && hashFiles('backend/coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const fila = (n, k) => `| ${n} | ${t[k].pct} % | ${t[k].covered}/${t[k].total} |`;
            console.log([
              "### Cobertura backend: dominio + aplicación (mínimo 70 %)",
              "",
              "| Métrica | % | Cubierto |",
              "|---|---|---|",
              fila("Líneas", "lines"),
              fila("Sentencias", "statements"),
              fila("Funciones", "functions"),
              fila("Ramas", "branches"),
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte de cobertura
        if: always() && hashFiles('backend/coverage/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/
          retention-days: 14

  frontend:
    name: Frontend (lint, pruebas, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mientras no exista frontend/ (HU-06), este job pasa sin hacer nada.
      - name: ¿Existe el frontend?
        id: existe
        run: |
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "Todavía no hay frontend/package.json (HU-06): se omite." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.existe.outputs.frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.existe.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.existe.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Pruebas
        if: steps.existe.outputs.frontend == 'true'
        working-directory: frontend
        run: npm test --if-present

      - name: Build
        if: steps.existe.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run build

  # Un solo check para marcar como requerido en la protección de dev y main.
  resultado:
    name: Resultado
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que backend y frontend pasaron
        run: |
          echo "backend: ${{ needs.backend.result }} · frontend: ${{ needs.frontend.result }}"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
