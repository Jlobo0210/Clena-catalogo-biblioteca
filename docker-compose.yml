# Levanta todo el sistema: docker compose up --build
# Antes, la primera vez: cp .env.example .env  y completar las credenciales de la base.
# Las credenciales no tienen valor por defecto para que nunca queden en el repositorio.
name: clena-catalogo

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env (ver .env.example)}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Datos de demostración: se cargan al arrancar (no duplican si se reinicia).
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:?Falta SEED_PASSWORD en .env (ver .env.example)}
    ports:
      - '${BACKEND_PORT:-3000}:3000'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-5173}:80'

volumes:
  db-data:
